name: LearnMate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript typecheck (lint)
        run: npm run lint

      - name: Unit & security integration tests
        run: npm test

      - name: Production Vite build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high || true
